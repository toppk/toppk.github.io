name: Publish project directory

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages/**'
      - 'tools/build-pages.py'
      - 'tools/projects.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public directory
        run: python3 tools/build-pages.py
      - name: Upload only public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
